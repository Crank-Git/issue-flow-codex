name: Upstream release check

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check upstream releases
        run: python3 scripts/upstream_check.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
