name: Tag release

on:
  push:
    branches:
      - main
    paths:
      - .codex-plugin/plugin.json

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag a changed plugin version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            exit 0
          fi
          if git cat-file -e "$BEFORE:.codex-plugin/plugin.json" 2>/dev/null; then
            git show "$BEFORE:.codex-plugin/plugin.json" > "$RUNNER_TEMP/previous-manifest.json"
          else
            : > "$RUNNER_TEMP/previous-manifest.json"
          fi
          tag="$(python3 scripts/release_tag.py "$RUNNER_TEMP/previous-manifest.json" .codex-plugin/plugin.json)"
          if [[ -n "$tag" ]]; then
            git tag "$tag"
            git push origin "$tag"
          fi
