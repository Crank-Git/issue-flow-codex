name: ci

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The mirror filter tests need git-filter-repo. No script imports it.
      - name: Install git-filter-repo
        run: pip install git-filter-repo
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Lock check
        run: python3 scripts/upstream_sync.py --check
      - name: Manifest check
        run: python3 scripts/validate_manifests.py
